name: blithepay
description: "Blithe School Fee Management"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  dio: ^5.9.0
  pretty_logger: ^1.0.0
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  go_router: ^17.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0
  connectivity_plus: ^7.0.0
  uuid: ^4.5.2
  shimmer: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  country_picker: ^2.0.27
  pretty_dio_logger: ^1.4.0
  permission_handler: ^12.0.1
  printing: ^5.14.2
  pdf: ^3.11.3
  path_provider: ^2.1.5
  bloc: ^9.2.0
  open_filex: ^4.7.0
  share_plus: ^12.0.1
  webview_flutter: ^4.13.1
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#EAF2FF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1E3A8A"
  image: assets/images/app_icon_white.png
  color_dark: "#1E3A8A"
  image_dark: assets/images/app_icon_white.png
  android_12:
    image: assets/images/app_icon_white.png
    color: "#1E3A8A"
  android: true
  ios: true
  web: false
