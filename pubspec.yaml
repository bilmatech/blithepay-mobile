name: blithepay
description: " Blithe School Fee Management"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  dio: ^5.9.0
  pretty_logger: ^1.0.0
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2 
  go_router: ^17.0.1 
  firebase_core: ^3.6.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0
  connectivity_plus: ^7.0.0
  uuid: ^4.5.2
  shimmer: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpg"
  min_sdk_android: 23
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: "assets/images/app_icon.jpg"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A1628"
  image: assets/images/app_icon.jpg
  color_dark: "#0A1628"
  image_dark: assets/images/app_icon.jpg
  android_12:
    image: assets/images/app_icon.jpg
    icon_background_color: "#0A1628"
    color: "#0A1628"
  android: true
  ios: true
  web: false
