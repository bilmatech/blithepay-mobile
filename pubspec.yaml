name: blithepay
description: "Blithe School Fee Management"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.5+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  dio: ^5.9.0
  pretty_logger: ^1.0.0
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  go_router: ^17.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.2.10
  firebase_auth: ^5.3.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.1
  flutter_local_notifications: ^19.5.0
  connectivity_plus: ^7.0.0
  uuid: ^4.5.2
  shimmer: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  country_picker: ^2.0.27
  pretty_dio_logger: ^1.4.0
  permission_handler: ^12.0.1
  printing: ^5.14.2
  pdf: ^3.11.3
  path_provider: ^2.1.5
  bloc: ^9.2.0
  open_filex: ^4.7.0
  share_plus: ^12.0.1
  media_store_plus: ^0.1.3
  webview_flutter: ^4.13.1
  rxdart: ^0.28.0
  crypto: ^3.0.3
  flutter_svg: ^2.0.10+1
  flutter_contacts: ^2.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  mime: ^2.0.0
  upgrader: ^11.0.0
  in_app_review: ^2.0.9
  device_info_plus: ^12.0.0
  package_info_plus: ^9.0.0
  shorebird_code_push: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 23
  adaptive_icon_background: "#EAF2FF"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  color_dark: "#FFFFFF"
  image_dark: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#FFFFFF"
  android: true
  ios: true
  web: false
